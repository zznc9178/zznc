<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ai</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:Arial,sans-serif;
            background: linear-gradient(180deg, #faf5ff 0%, #f3e8ff 30%, #ede9fe 60%, #faf5ff 100%);
            height:100vh;
            display:flex;
            flex-direction:column;
        }
        .topbar{
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color:white;
            padding:14px 16px;
            display:flex;
            align-items:center;
            gap:12px;
            box-shadow: 0 2px 10px rgba(124,58,237,0.3);
        }
        .topbar a{
            color:white;
            text-decoration:none;
            font-size:16px;
            padding:6px 12px;
            background: rgba(255,255,255,0.15);
            border-radius:16px;
        }
        .topbar a:hover{ background: rgba(255,255,255,0.25); }
        .topbar .title{ font-weight:bold; font-size:17px; }
        #chat-box{
            flex:1;
            overflow-y:auto;
            padding:16px;
        }
        .u-msg{
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
            color:white;
            padding:10px 14px;
            border-radius:16px 16px 4px 16px;
            margin:8px 0;
            max-width:80%;
            margin-left:auto;
            word-break:break-word;
            box-shadow: 0 2px 6px rgba(124,58,237,0.2);
        }
        .a-msg{
            background:white;
            color:#4c1d95;
            padding:10px 14px;
            border-radius:16px 16px 16px 4px;
            margin:8px 0;
            max-width:80%;
            word-break:break-word;
            box-shadow: 0 2px 6px rgba(0,0,0,.06);
            border-left: 3px solid #a78bfa;
        }
        .e-msg{
            background:#fef2f2;
            color:#c00;
            padding:10px 14px;
            border-radius:16px;
            margin:8px 0;
            max-width:80%;
        }
        footer{
            padding:12px 16px;
            background:white;
            border-top:2px solid #ede9fe;
            display:flex;
            gap:10px;
        }
        footer input{
            flex:1;
            padding:12px;
            border-radius:24px;
            border:2px solid #d8c9f0;
            font-size:16px;
            outline:none;
            background:#faf5ff;
        }
        footer input:focus{ border-color:#7c3aed; }
        footer button{
            padding:12px 24px;
            border-radius:24px;
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
            color:white;
            border:none;
            font-size:16px;
            cursor:pointer;
            box-shadow: 0 2px 8px rgba(124,58,237,0.3);
        }
        footer button:disabled{ background:#ccc; box-shadow:none; }
    </style>
</head>
<body>

<!-- ========== ⚠️ 顶部栏不要改 ========== -->
<div class="topbar">
    <a href=" " onclick="window.location.href='index.html';return false;">← </a >
    <span class="title">ai</span>
</div>
<!-- ========== ⚠️ 顶部栏结束 ========== -->

<!-- ========== 🎨 欢迎语——可以改 ========== -->
<div id="chat-box">
    <div class="a-msg">
ai<br><br>
我是<b>紫糯</b>！<br>
这里的ai已经接入DeepSeekAPI<br>
当前模型为DeepSeek V4 Flash
    </div>
</div>
<!-- ========== 🎨 欢迎语结束 ========== -->

<footer>
    <input id="u" type="text" placeholder="这里打字..." />
    <button id="b">发送</button>
</footer>

<!-- ========== ⚠️ script 区域 ========== -->
<script>
(function(){
var box=document.getElementById("chat-box");
var inp=document.getElementById("u");
var btn=document.getElementById("b");

// ========== 🎨 紫糯的性格设定——可以改 content 内容 ==========
var msgs=[{
    role:"system",
    content:"请始终用中文回复。"
}];
// ========== 🎨 性格设定结束 ==========

// ⚠️ 下面的逻辑代码不要改
btn.onclick=function(){send();};
inp.onkeydown=function(e){if(e.key==="Enter")send();};

function send(){
    var t=inp.value.trim();
    if(!t)return;
    box.innerHTML+='<div class="u-msg">'+t+'</div>';
    msgs.push({role:"user",content:t});
    inp.value="";
    box.scrollTop=box.scrollHeight;
    var lid="x"+Date.now();
    box.innerHTML+='<div id="'+lid+'" class="a-msg">思考中...</div>';
    box.scrollTop=box.scrollHeight;
    btn.disabled=true;

    // 🔒 调后端中转，Key 安全藏在服务器
    fetch("/api/chat",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({messages:msgs})
    })
    .then(function(r){return r.json();})
    .then(function(d){
        var el=document.getElementById(lid);if(el)el.remove();
        if(d.error){box.innerHTML+='<div class="e-msg">❌ '+d.error+'</div>'}
        else{box.innerHTML+='<div class="a-msg">'+d.reply+'</div>';msgs.push({role:"assistant",content:d.reply})}
        btn.disabled=false;box.scrollTop=box.scrollHeight;
    })
    .catch(function(){
        var el=document.getElementById(lid);if(el)el.remove();
        box.innerHTML+='<div class="e-msg">出问题了 请重试或者联系我（zznc）</div>';
        btn.disabled=false;
    });
}
})();
</script>
<!-- ========== ⚠️ script 结束 ========== -->

</body>
</html>
