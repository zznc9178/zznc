<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💜 紫糯的小窝</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:Arial,sans-serif;
            background: linear-gradient(180deg, #faf5ff 0%, #f3e8ff 30%, #ede9fe 60%, #faf5ff 100%);
            background-attachment: fixed;
            min-height:100vh;
            padding-bottom:40px;
        }

        /* 顶部横幅 */
        .hero{
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color:white;
            padding:30px 20px 25px;
            text-align:center;
            box-shadow: 0 4px 20px rgba(124,58,237,0.3);
            border-radius: 0 0 30px 30px;
        }
.hero .avatar{
    width:80px;
    height:80px;
    background-size: cover;
    background-position: center;
    border-radius:50%;
    margin:0 auto 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}
        .hero h1{ font-size:22px; margin-bottom:4px; }
        .hero p{ font-size:14px; opacity:0.85; }

        /* 卡片网格 */
        .card-grid{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap:14px;
            padding:20px 16px;
            max-width:500px;
            margin:0 auto;
        }
        .card{
            background:white;
            border-radius:20px;
            padding:20px 14px;
            text-decoration:none;
            color:#4c1d95;
            box-shadow: 0 3px 12px rgba(124,58,237,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            display:flex;
            flex-direction:column;
            align-items:center;
            text-align:center;
            cursor:pointer;
            border: 2px solid transparent;
            position:relative;
        }
        .card:hover{
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(124,58,237,0.18);
            border-color: #a78bfa;
        }
        .card .icon{ font-size:40px; margin-bottom:8px; }
        .card .title{ font-size:15px; font-weight:bold; margin-bottom:4px; }
        .card .desc{ font-size:12px; color:#999; line-height:1.4; }

        /* 宽卡片占两格 */
        .card.wide{ grid-column: span 2; }

        /* 备用卡片样式 */
        .card.placeholder-card{
            opacity:0.55;
            cursor:default;
            border: 2px dashed #d8c9f0;
        }
        .card.placeholder-card:hover{
            transform:none;
            box-shadow: 0 3px 12px rgba(124,58,237,0.08);
            border-color: #d8c9f0;
        }
        .coming-badge{
            position:absolute;
            top:10px;
            right:10px;
            background:#ede9fe;
            color:#7c3aed;
            font-size:10px;
            padding:3px 8px;
            border-radius:10px;
            font-weight:bold;
        }

        /* 底部 */
        .footer-text{
            text-align:center;
            color:#c4b5d9;
            font-size:12px;
            padding:10px;
        }
    </style>
</head>
<body>

<!-- ========== 🎨 顶部横幅——改成你自己的 ========== -->
<div class="hero">
<div class="avatar" style="background-image:url('avatar.png');"></div>
    <h1>喵喵喵</h1>
    <p>自己做的一个以后用来自我介绍的小网站 嗯对</p >
</div>
<!-- ========== 🎨 顶部横幅结束 ========== -->

<!-- ========== 🎨 卡片区——已确定的可以改图标/标题/描述，备用卡片随便改 ========== -->
<div class="card-grid">

    <!-- ✅ 设定简介（宽卡片，跳转 about.html） -->
<a href="about.html" class="card wide" onclick="window.location.href='about.html';return false;" style="position:relative;z-index:10;">
        <div class="icon">📖</div>
        <div class="title">设定简介</div>
        <div class="desc">这里可以点</div>
    </a >

    <!-- ✅ AI 聊天（跳转 chat.html） -->
    <a href="chat.html" class="card">
        <div class="icon"> </div>
        <div class="title">ai</div>
        <div class="desc">这里可以点</div>
    </a >

    <!-- ✅ 联系方式（跳转 contact.html） -->
    <a href="contact.html" class="card">
        <div class="icon"> </div>
        <div class="title">联系方式</div>
        <div class="desc">这里可以点</div>
    </a >

    <!-- ⬜ 备用一（暂不跳转，以后想好了再改 href） -->
    <a href="javascript:void(0)" class="card placeholder-card" onclick="return false;">
        <span class="coming-badge">没想好</span>
        <div class="icon"> </div>
        <div class="title">备用一</div>
        <div class="desc">以后可能放收款码</div>
    </a >

    <!-- ⬜ 备用二（暂不跳转） -->
    <a href="javascript:void(0)" class="card placeholder-card" onclick="return false;">
        <span class="coming-badge">没想好</span>
        <div class="icon"> </div>
        <div class="title">备用二</div>
        <div class="desc">没想好</div>
    </a >

    <!-- ⬜ 备用三（暂不跳转） -->
    <a href="javascript:void(0)" class="card placeholder-card" onclick="return false;">
        <span class="coming-badge">没想好</span>
        <div class="icon"> </div>
        <div class="title">备用三</div>
        <div class="desc">没想好</div>
    </a >

    <!-- ⬜ 备用四（暂不跳转） -->
    <a href=" " class="card placeholder-card" onclick="return false;">
        <span class="coming-badge">没想好</span>
        <div class="icon"> </div>
        <div class="title">备用四</div>
        <div class="desc">没想好</div>
    </a >
</div>
<!-- ========== 🎨 卡片区结束 ========== -->
<!-- ========== 🎨 底部文字——改成你自己的 ========== -->
<div class="footer-text"喵喵喵</div>
<!-- ========== 🎨 底部文字结束 ========== -->
</body>
</html>
