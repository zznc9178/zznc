<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek 助手</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#f0f2f5;height:100vh;display:flex;flex-direction:column}
        header{background:#4f46e5;color:white;padding:16px;text-align:center;font-size:18px;font-weight:bold}
        #chat-box{flex:1;overflow-y:auto;padding:16px}
        .u-msg{background:#4f46e5;color:white;padding:10px 14px;border-radius:16px 16px 4px 16px;margin:8px 0;max-width:80%;margin-left:auto;word-break:break-word}
        .a-msg{background:white;color:#333;padding:10px 14px;border-radius:16px 16px 16px 4px;margin:8px 0;max-width:80%;word-break:break-word;box-shadow:0 1px 3px rgba(0,0,0,.1)}
        .e-msg{background:#fff0f0;color:#c00;padding:10px 14px;border-radius:16px;margin:8px 0;max-width:80%}
        footer{padding:12px 16px;background:white;border-top:1px solid #e0e0e0;display:flex;gap:10px}
        footer input{flex:1;padding:12px;border-radius:24px;border:1px solid #ccc;font-size:16px}
        footer button{padding:12px 24px;border-radius:24px;background:#4f46e5;color:white;border:none;font-size:16px;cursor:pointer}
        footer button:disabled{background:#ccc}
    </style>
</head>
<body>

<!-- ========== 🎨 下面是你可以随意修改的部分 ========== -->
<header> DeepSeek zznc自费版</header>
<div id="chat-box"><div class="a-msg">时间太晚了以后再完善w</div></div>
<footer>
    <input id="u" type="text" placeholder="这里打字" />
    <button id="b">发送</button>
</footer>
<!-- ========== 🎨 上面是你可以随意修改的部分 ========== -->

<!-- ========== ⚠️ 下面的 script 一个字都不要改！⚠️ ========== -->
<script>
(function(){
var box=document.getElementById("chat-box");
var inp=document.getElementById("u");
var btn=document.getElementById("b");
var msgs=[{role:"system",content:"请始终使用中文回复。"}];

btn.onclick=function(){send();};
inp.onkeydown=function(e){if(e.key==="Enter")send();};

function send(){
    var t=inp.value.trim();
    if(!t)return;
    box.innerHTML+='<div class="u-msg">'+t+'</div>';
    msgs.push({role:"user",content:t});
    inp.value="";
    box.scrollTop=box.scrollHeight;
    var lid="x"+Date.now();
    box.innerHTML+='<div id="'+lid+'" class="a-msg">思考中...</div>';
    box.scrollTop=box.scrollHeight;
    btn.disabled=true;
    fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:msgs})})
    .then(function(r){return r.json()})
    .then(function(d){
        var el=document.getElementById(lid);if(el)el.remove();
        if(d.error){box.innerHTML+='<div class="e-msg">❌ '+d.error+'</div>'}
        else{box.innerHTML+='<div class="a-msg">'+d.reply+'</div>';msgs.push({role:"assistant",content:d.reply})}
        btn.disabled=false;box.scrollTop=box.scrollHeight;
    })
    .catch(function(){
        var el=document.getElementById(lid);if(el)el.remove();
        box.innerHTML+='<div class="e-msg">❌ 网络错误</div>';
        btn.disabled=false;
    });
}
})();
</script>
<!-- ========== ⚠️ 上面的 script 一个字都不要改！⚠️ ========== -->

</body>
</html>
