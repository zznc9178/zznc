<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 设定</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:Arial,sans-serif;
            background: linear-gradient(180deg, #faf5ff 0%, #f3e8ff 30%, #ede9fe 60%, #faf5ff 100%);
            background-attachment: fixed;
            min-height:100vh;
            padding:20px 16px 40px;
        }
        .back{
            display:inline-block;
            color:#7c3aed;
            text-decoration:none;
            font-size:14px;
            margin-bottom:16px;
        }
        .back:hover{ text-decoration:underline; }
        .card{
            background:white;
            border-radius:20px;
            padding:24px 18px;
            box-shadow: 0 3px 12px rgba(124,58,237,0.08);
            max-width:500px;
            margin:0 auto;
            color:#4c1d95;
            line-height:1.8;
            font-size:15px;
            border-left:4px solid #a78bfa;
        }
        .card h2{ font-size:20px; margin-bottom:14px; color:#6d28d9; }
        .card h3{ font-size:16px; margin:16px 0 8px; color:#7c3aed; }
        .card p{ margin-bottom:12px; }
        .tag{
            display:inline-block;
            background:#ede9fe;
            color:#7c3aed;
            padding:4px 12px;
            border-radius:20px;
            font-size:13px;
            margin:3px 4px;
        }
    </style>
</head>
<body>

<!-- ========== ⚠️ 返回按钮不要改 ========== -->
<a href=" " class="back" onclick="window.location.href='index.html';return false;">← </a >
<div class="card">
    <!-- ========== 🎨 设定内容——随便改 ========== -->
    <h2>📖 这里我计划写简介</h2>

    <p>这里计划写欢迎语<b>这里写名字</b>，这里继续欢迎语 💜</p >

    <p>🟣 <b>名字：</b>紫糯</p >
    <p>🐾 <b>物种：</b>龙狐</p >
    <p>🎂 <b>生日：</b>设定生日25.06.20</p >
    <p>📍 <b>出没地：</b>无锡</p >

    <h3>🌟 喜欢的东西</h3>
    <p>
        <span class="tag">（这里爱好）晚点写太累了</span>
        <span class="tag">（这里爱好）</span>
        <span class="tag">（这里爱好）</span>
        <span class="tag">（这里爱好）</span>
        <span class="tag">（这里爱好）</span>
    </p >

    <h3>💬 这里简介</h3>
    <p>（自我介绍）</p >

    <p>（继续自我介绍）</p >

    <!-- ========== 🎨 设定内容结束 ========== -->
</div>

</body>
</html>
